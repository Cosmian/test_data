name = "KMIP 1.4 RSA-4096 OAEP Encrypt/Decrypt"
description = "RSA encryption lifecycle using KMIP 1.4"
wire_format = "binary"
kmip_version = [1, 4]

[[steps]]
operation = "CreateKeyPair"
request = "step1_create_keypair.json"
assert_success = true

[steps.capture]
private_key_id = "PrivateKeyUniqueIdentifier"
public_key_id = "PublicKeyUniqueIdentifier"

[[steps]]
operation = "Activate"
request = "step2_activate_sk.json"
assert_success = true

[[steps]]
operation = "Activate"
request = "step3_activate_pk.json"
assert_success = true

[[steps]]
operation = "Encrypt"
request = "step4_encrypt.json"
assert_success = true

[steps.capture]
ciphertext = "Data"

[[steps]]
operation = "Decrypt"
request = "step5_decrypt.json"
assert_success = true

[steps.assert_fields]
Data = "48656C6C6F2C20576F726C642120546869732069732061207465737420666F72204B4D49502E"

[[steps]]
operation = "Revoke"
request = "step6_revoke_sk.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step7_destroy_sk.json"
assert_success = true

[[steps]]
operation = "Revoke"
request = "step8_revoke_pk.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step9_destroy_pk.json"
assert_success = true
