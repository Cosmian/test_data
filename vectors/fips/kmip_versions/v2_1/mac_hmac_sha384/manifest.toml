name = "KMIP 2.1 MAC HMACSHA384"
description = "MAC lifecycle with HMACSHA384 using KMIP 2.1"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Activate"
request = "step2_activate.json"
assert_success = true

[[steps]]
operation = "MAC"
request = "step3_mac.json"
assert_success = true

[steps.capture]
mac_data = "MACData"

[[steps]]
operation = "MACVerify"
request = "step4_mac_verify.json"
assert_success = true

[[steps]]
operation = "Revoke"
request = "step5_revoke.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step6_destroy.json"
assert_success = true
