name = "KMIP 1.3 Check"
description = "Check key state using KMIP 1.3"
wire_format = "binary"
kmip_version = [1, 3]

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Check"
request = "step2_check.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step3_destroy.json"
assert_success = true
