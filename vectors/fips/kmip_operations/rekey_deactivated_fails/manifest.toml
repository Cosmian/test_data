name = "Negative: ReKey Destroyed Key Fails"
description = """
Verifies that ReKey on a Destroyed symmetric key fails: a Destroyed key behaves as not found.
"""

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

# Revoke with a non-compromise reason is refused on a Pre-Active key (KMIP 2.1 §4.57)
[[steps]]
operation = "Revoke"
request = "step2_revoke.json"
assert_success = false
assert_error_reason = "Wrong_Key_Lifecycle_State"

# Destroy the key (Pre-Active → Destroyed)
[[steps]]
operation = "Destroy"
request = "step3_destroy.json"
assert_success = true

# Try to ReKey the destroyed key — must fail
[[steps]]
operation = "ReKey"
request = "step4_rekey.json"
assert_success = false
assert_error_reason = "Item_Not_Found"
assert_error_contains = "no valid key found"
