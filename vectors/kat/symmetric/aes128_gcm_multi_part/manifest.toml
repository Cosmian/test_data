name = "KAT: multi-part AES-128-GCM Encrypt and Decrypt (CS-BC-M-GCM-3-21)"
description = "KMIP 2.1 §6.1 multi-part Encrypt/Decrypt: the server keeps the GCM state under the Correlation Value; each part returns its ciphertext/plaintext and the tag comes with the final Encrypt part (OASIS CS-BC-M-GCM-3-21 values)"

[[steps]]
operation = "Import"
request = "step1_import_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Encrypt"
request = "step2_encrypt_init.json"
assert_success = true
[steps.assert_fields]
Data = "61353B4C2806934A777FF51FA22A4755699B2A714FCDC6F83766E5F97B6C7423"
[steps.capture]
enc_cv = "CorrelationValue"

[[steps]]
operation = "Encrypt"
request = "step3_encrypt_final.json"
assert_success = true
[steps.assert_fields]
Data = "73806900E49F24B22B097544D4896B424989B5E1EBAC0F07C23F4598"
AuthenticatedEncryptionTag = "3612D2E79E3B0785561BE14AACA2FCCB"

[[steps]]
operation = "Decrypt"
request = "step4_decrypt_init.json"
assert_success = true
[steps.assert_fields]
Data = "D9313225F88406E5A55909C5AFF5269A86A7A9531534F7DA2E4C303D8A318A72"
[steps.capture]
dec_cv = "CorrelationValue"

[[steps]]
operation = "Decrypt"
request = "step5_decrypt_final.json"
assert_success = true
[steps.assert_fields]
Data = "1C3C0C95956809532FCF0E2449A6B525B16AEDF5AA0DE657BA637B39"
