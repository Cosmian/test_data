name = "KAT: AES-256-GCM (NIST SP 800-38D TC7) - decrypt only"
description = "Known-Answer Test: AES-256 GCM with NIST SP 800-38D Test Case 7 parameters. Decrypt only: a FIPS build never encrypts with a caller-chosen IV"

[[steps]]
operation = "Import"
request = "step1_import_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Decrypt"
request = "step2_decrypt.json"
assert_success = true
[steps.assert_fields]
