name = "KAT: multi-part AES-128-GCM Decrypt with a 96-bit IV (NIST SP 800-38D)"
description = "KMIP 2.1 section 6.1 multi-part Decrypt of the single-part KAT ciphertext split in two parts; a FIPS build accepts only 96-bit GCM IVs and never encrypts with a caller-chosen one"

[[steps]]
operation = "Import"
request = "step1_import_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Decrypt"
request = "step2_decrypt_init.json"
assert_success = true
[steps.assert_fields]
Data = "D9313225F88406E5A55909C5AFF5269A86A7A9531534F7DA2E4C303D8A318A72"
[steps.capture]
dec_cv = "CorrelationValue"

[[steps]]
operation = "Decrypt"
request = "step3_decrypt_final.json"
assert_success = true
[steps.assert_fields]
Data = "1C3C0C95956809532FCF0E2449A6B525B16AEDF5AA0DE657BA637B391AAFD255"
