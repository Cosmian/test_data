name = "KAT: PBKDF2-SHA256 (known 32-byte password, 16-byte salt='saltSALTsaltSALT', 4096 iters)"
description = "Known-Answer Test: PBKDF2-SHA256 with 32-byte password key, 4096 iterations; 16-byte salt (NIST SP 800-132 minimum), expected key from an independent implementation"

[[steps]]
operation = "Import"
request = "step1_import_password.json"
assert_success = true
[steps.capture]
base_key_id = "UniqueIdentifier"

[[steps]]
operation = "DeriveKey"
request = "step2_derive.json"
assert_success = true
[steps.capture]
derived_key_id = "UniqueIdentifier"

[[steps]]
operation = "Get"
request = "step3_get.json"
assert_success = true
[steps.assert_fields]
KeyMaterial = "BA31A1D047C939D21B550D27703EECCDCED6FC9D8A836CB4A8CE951CE7EC24AD"
