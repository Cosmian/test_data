name = "KAT: PBKDF2-SHA512 (known 32-byte password, 16-byte salt='saltSALTsaltSALT', 4096 iters)"
description = "Known-Answer Test: PBKDF2-SHA512 with 32-byte password key, 4096 iterations; 16-byte salt (NIST SP 800-132 minimum), expected key from an independent implementation"

[[steps]]
operation = "Import"
request = "step1_import_password.json"
assert_success = true
[steps.capture]
base_key_id = "UniqueIdentifier"

[[steps]]
operation = "DeriveKey"
request = "step2_derive.json"
assert_success = true
[steps.capture]
derived_key_id = "UniqueIdentifier"

[[steps]]
operation = "Get"
request = "step3_get.json"
assert_success = true
[steps.assert_fields]
KeyMaterial = "980D21ECBFD31DF54AE30BE49980623409E1832DE3D72E0909B39584C0DE8495"
