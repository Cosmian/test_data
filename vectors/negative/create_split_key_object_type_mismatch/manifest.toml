name = "CreateSplitKey: Object Type neither Split Key nor the source key type"
description = "A CreateSplitKey request whose Object Type is neither Split Key nor the type of the key to split fails with Invalid_Object_Type (KMIP 2.1 Table 195)"

[[steps]]
operation = "Create"
request = "step1_create_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "CreateSplitKey"
request = "step2_create_split_key.json"
assert_success = false
assert_error_reason = "Invalid_Object_Type"
assert_error_contains = "Object Type"
