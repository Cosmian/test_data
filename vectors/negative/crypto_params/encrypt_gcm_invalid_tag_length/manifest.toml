name = "Negative: Encrypt GCM With Invalid Tag Length"
description = "Tests that AES-GCM encryption fails with an invalid authentication tag length"

[[steps]]
operation = "Create"
request = "step1_create_key.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Encrypt"
request = "step2_encrypt_bad_tag.json"
assert_success = false
# KMIP 2.1 Encrypt error table: an invalid TagLength is Bad_Cryptographic_Parameters
# (OASIS CS-BC-M-GCM-1-21 expects General_Failure, which the table does not list).
assert_error_reason = "Bad_Cryptographic_Parameters"
assert_error_contains = "tag"
