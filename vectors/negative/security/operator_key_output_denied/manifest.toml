name = "Negative security: operator_key_output_denied"
description = "An Operator granted get/export/encrypt can encrypt but never read key material"
server_config = "test_data/configs/server/auth/cert_roles.toml"

[identities.owner]
client_cert = "test_data/certificates/client_server/owner/owner.client.acme.com.crt"
client_key = "test_data/certificates/client_server/owner/owner.client.acme.com.key"

[identities.user]
client_cert = "test_data/certificates/client_server/user/user.client.acme.com.crt"
client_key = "test_data/certificates/client_server/user/user.client.acme.com.key"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "GrantAccess"
request = "step2_grant.json"
assert_success = true

[[steps]]
operation = "Get"
request = "step3_user_get.json"
identity = "user"
assert_success = false
assert_error_reason = "Permission_Denied"
assert_error_contains = "role: Operator"

[[steps]]
operation = "Export"
request = "step4_user_export.json"
identity = "user"
assert_success = false
assert_error_reason = "Permission_Denied"
assert_error_contains = "role: Operator"

[[steps]]
operation = "Encrypt"
request = "step5_user_encrypt.json"
identity = "user"
assert_success = true

[[steps]]
operation = "GetAttributes"
request = "step6_owner_integrity.json"
assert_success = true
