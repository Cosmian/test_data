name = "Negative security: extractable_cannot_be_reenabled"
description = "Extractable=false cannot be flipped back to true to export the key"
server_config = "test_data/configs/server/auth/cert.toml"

[identities.owner]
client_cert = "test_data/certificates/client_server/owner/owner.client.acme.com.crt"
client_key = "test_data/certificates/client_server/owner/owner.client.acme.com.key"

[identities.user]
client_cert = "test_data/certificates/client_server/user/user.client.acme.com.crt"
client_key = "test_data/certificates/client_server/user/user.client.acme.com.key"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "SetAttribute"
request = "step2_setattribute.json"
assert_success = false
assert_error_reason = "Read_Only_Attribute"
assert_error_contains = "DENIED"

[[steps]]
operation = "Get"
request = "step3_get.json"
assert_success = false
assert_error_reason = "Not_Extractable"
assert_error_contains = "DENIED"

[[steps]]
operation = "GetAttributes"
request = "step4_owner_integrity.json"
assert_success = true
