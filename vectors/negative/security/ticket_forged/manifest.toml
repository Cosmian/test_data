name = "Negative security: ticket_forged"
description = "Guessed tickets of 32 and 16 zero bytes are refused"
server_config = "test_data/configs/server/auth/cert.toml"

[identities.owner]
client_cert = "test_data/certificates/client_server/owner/owner.client.acme.com.crt"
client_key = "test_data/certificates/client_server/owner/owner.client.acme.com.key"

[identities.user]
client_cert = "test_data/certificates/client_server/user/user.client.acme.com.crt"
client_key = "test_data/certificates/client_server/user/user.client.acme.com.key"

[[steps]]
operation = "Query"
request = "step1_query_ticket32.json"
identity = "user"
raw_request = true
assert_success = false
assert_error_reason = "Invalid_Ticket"
assert_error_contains = "unknown, expired or exhausted ticket"

[[steps]]
operation = "Query"
request = "step2_query_ticket16.json"
identity = "user"
raw_request = true
assert_success = false
assert_error_reason = "Invalid_Ticket"
assert_error_contains = "unknown, expired or exhausted ticket"

[[steps]]
operation = "Query"
request = "step3_owner_query.json"
raw_request = true
assert_success = true
