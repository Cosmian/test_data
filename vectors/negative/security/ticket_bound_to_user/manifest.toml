name = "Negative security: ticket_bound_to_user"
description = "A Login ticket cannot be used or logged out by another user"
server_config = "test_data/configs/server/auth/cert.toml"

[identities.owner]
client_cert = "test_data/certificates/client_server/owner/owner.client.acme.com.crt"
client_key = "test_data/certificates/client_server/owner/owner.client.acme.com.key"

[identities.user]
client_cert = "test_data/certificates/client_server/user/user.client.acme.com.crt"
client_key = "test_data/certificates/client_server/user/user.client.acme.com.key"

[[steps]]
operation = "Login"
request = "step1_login.json"
assert_success = true

[steps.capture]
ticket = "TicketValue"

[[steps]]
operation = "Query"
request = "step2_user_query_ticket.json"
identity = "user"
raw_request = true
assert_success = false
assert_error_reason = "Invalid_Ticket"
assert_error_contains = "unknown, expired or exhausted ticket"

[[steps]]
operation = "Logout"
request = "step3_user_logout.json"
identity = "user"
assert_success = false
assert_error_reason = "Invalid_Ticket"
assert_error_contains = "unknown, expired or exhausted ticket"

[[steps]]
operation = "Query"
request = "step4_owner_query_ticket.json"
raw_request = true
assert_success = true
