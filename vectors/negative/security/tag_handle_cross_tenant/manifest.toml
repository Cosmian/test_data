name = "Negative security: tag_handle_cross_tenant"
description = "A tag handle never resolves to, nor reveals, another user's key"
server_config = "test_data/configs/server/auth/cert.toml"

[identities.owner]
client_cert = "test_data/certificates/client_server/owner/owner.client.acme.com.crt"
client_key = "test_data/certificates/client_server/owner/owner.client.acme.com.key"

[identities.user]
client_cert = "test_data/certificates/client_server/user/user.client.acme.com.crt"
client_key = "test_data/certificates/client_server/user/user.client.acme.com.key"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Encrypt"
request = "step2_user_encrypt_tag_foreign.json"
identity = "user"
assert_success = false
assert_error_reason = "Item_Not_Found"
assert_error_contains = "not found"

[[steps]]
operation = "Create"
request = "step3_user_create.json"
identity = "user"
assert_success = true

[steps.capture]
user_key = "UniqueIdentifier"

[[steps]]
operation = "Encrypt"
request = "step4_user_encrypt_tag_own.json"
identity = "user"
assert_success = true

[[steps]]
operation = "Locate"
request = "step5_user_locate.json"
identity = "user"
assert_success = true

[steps.assert_count]
UniqueIdentifier = 1

[[steps]]
operation = "GetAttributes"
request = "step6_owner_integrity.json"
assert_success = true
