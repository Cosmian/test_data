name = "Negative robustness: multipart_correlation_value_bad_length"
description = "A 15-byte Correlation Value is refused"

[[steps]]
operation = "CreateKeyPair"
request = "step1_createkeypair.json"
assert_success = true

[steps.capture]
sk_id = "PrivateKeyUniqueIdentifier"

[[steps]]
operation = "Sign"
request = "step2_sign.json"
assert_success = false
assert_error_reason = "Invalid_Correlation_Value"
assert_error_contains = "unknown or expired Correlation Value"

[[steps]]
operation = "DiscoverVersions"
request = "step3_liveness.json"
assert_success = true
