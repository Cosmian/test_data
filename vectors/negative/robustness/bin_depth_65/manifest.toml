name = "Negative robustness: bin_depth_65"
description = "Binary TTLV nested to depth 65 exceeds the depth limit of 64"

[[steps]]
operation = "RawHttp"
request = "step1_raw.json"
assert_success = false
assert_error_reason = "Invalid_Message"
assert_error_contains = "depth"

[[steps]]
operation = "DiscoverVersions"
request = "step2_liveness.json"
assert_success = true
