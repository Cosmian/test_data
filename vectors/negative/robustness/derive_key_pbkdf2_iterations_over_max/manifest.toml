name = "Negative robustness: derive_key_pbkdf2_iterations_over_max"
description = "PBKDF2 IterationCount above the upper bound is rejected"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "DeriveKey"
request = "step2_derivekey.json"
assert_success = false
assert_error_reason = "Invalid_Field"
assert_error_contains = "must be between 1 and"

[[steps]]
operation = "DiscoverVersions"
request = "step3_liveness.json"
assert_success = true
