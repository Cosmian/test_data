name = "Negative robustness: bin_integer_length_5"
description = "Integer whose length is not 4 is rejected"

[[steps]]
operation = "RawHttp"
request = "step1_raw.json"
assert_success = false
assert_error_reason = "Invalid_Message"
assert_error_contains = "Integer length must be 4"

[[steps]]
operation = "DiscoverVersions"
request = "step2_liveness.json"
assert_success = true
