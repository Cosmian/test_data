name = "Negative robustness: create_rsa_modulus_over_max"
description = "CreateKeyPair RSA above the 16384-bit maximum is rejected promptly"

[[steps]]
operation = "CreateKeyPair"
request = "step1_createkeypair.json"
assert_success = false
assert_error_reason = "Cryptographic_Failure"
assert_error_contains = "exceeds the maximum of 16384 bits"

[[steps]]
operation = "DiscoverVersions"
request = "step2_liveness.json"
assert_success = true
