name = "Negative robustness: msg_max_response_size_negative"
description = "Negative MaximumResponseSize is rejected"

[[steps]]
operation = "Query"
request = "step1_query.json"
raw_request = true
assert_success = false
assert_error_reason = "Invalid_Field"
assert_error_contains = "must be non-negative"

[[steps]]
operation = "DiscoverVersions"
request = "step2_liveness.json"
assert_success = true
