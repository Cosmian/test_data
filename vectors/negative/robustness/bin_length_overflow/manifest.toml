name = "Negative robustness: bin_length_overflow"
description = "Binary TTLV declaring a ~4 GiB structure but carrying 32 bytes is rejected"

[[steps]]
operation = "RawHttp"
request = "step1_raw.json"
assert_success = false
assert_error_reason = "Invalid_Message"
assert_error_contains = "failed to fill whole buffer"

[[steps]]
operation = "DiscoverVersions"
request = "step2_liveness.json"
assert_success = true
