name = "Negative robustness: bin_textstring_invalid_utf8"
description = "TextString holding invalid UTF-8 is rejected"

[[steps]]
operation = "RawHttp"
request = "step1_raw.json"
assert_success = false
assert_error_reason = "Invalid_Message"
assert_error_contains = "invalid utf-8 sequence"

[[steps]]
operation = "DiscoverVersions"
request = "step2_liveness.json"
assert_success = true
