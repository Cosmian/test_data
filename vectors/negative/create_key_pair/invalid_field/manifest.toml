name = "Negative: Create Key Pair - Invalid Field"
description = "Tests that Create Key Pair rejects a request without a Cryptographic Algorithm with Invalid_Field (KMIP 2.1 Table 192)"

[[steps]]
operation = "CreateKeyPair"
request = "step1_createkeypair.json"
assert_success = false
assert_error_reason = "Invalid_Field"
assert_error_contains = "cryptographic algorithm must be specified"
