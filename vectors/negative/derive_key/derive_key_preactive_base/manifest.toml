name = "Negative: DeriveKey from a Pre-Active base key"
description = "Tests that DeriveKey refuses a Pre-Active base key with Wrong_Key_Lifecycle_State (KMIP 2.1 Table 207)"

[[steps]]
operation = "Create"
request = "step1_create_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "DeriveKey"
request = "step2_derive.json"
assert_success = false
assert_error_reason = "Wrong_Key_Lifecycle_State"
assert_error_contains = "must be Active"
