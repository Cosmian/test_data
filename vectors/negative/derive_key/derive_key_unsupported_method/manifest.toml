name = "Negative: DeriveKey with an unsupported derivation method"
description = "Tests that DeriveKey rejects an unsupported Derivation Method with Feature_Not_Supported (KMIP 2.1 Table 207)"

[[steps]]
operation = "Create"
request = "step1_create_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "DeriveKey"
request = "step2_derive.json"
assert_success = false
assert_error_reason = "Feature_Not_Supported"
assert_error_contains = "Unsupported derivation method"
