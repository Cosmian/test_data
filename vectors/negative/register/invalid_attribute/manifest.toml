name = "Negative: Register - Invalid Attribute"
description = "Tests that Register rejects an attribute that does not apply to the object type (Cryptographic Domain Parameters on a Symmetric Key, KMIP 2.1 §4.14) with Invalid_Attribute"

[[steps]]
operation = "Register"
request = "step1_register.json"
assert_success = false
assert_error_reason = "Invalid_Attribute"
assert_error_contains = "Cryptographic Domain Parameters"
