name = "Negative: Register - Invalid Attribute Value"
description = "Tests that Register rejects a Cryptographic Length of 0 with Invalid_Attribute_Value (KMIP 2.1 Table 294)"

[[steps]]
operation = "Register"
request = "step1_register.json"
assert_success = false
assert_error_reason = "Invalid_Attribute_Value"
assert_error_contains = "Cryptographic Length"
