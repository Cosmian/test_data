name = "Negative: Encrypt - Invalid Field"
description = "Tests that Encrypt rejects an unsupported field value (OFB mode) with Operation_Not_Supported, listed in the KMIP 2.1 Encrypt error table"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Activate"
request = "step2_activate.json"
assert_success = true

[[steps]]
operation = "Encrypt"
request = "step3_encrypt.json"
assert_success = false
assert_error_reason = "Operation_Not_Supported"
assert_error_contains = "not supported"
