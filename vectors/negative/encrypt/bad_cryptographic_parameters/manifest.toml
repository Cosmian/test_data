name = "Negative: Encrypt - Bad Cryptographic Parameters"
description = "Tests that Encrypt returns Bad_Cryptographic_Parameters error as per KMIP spec"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Activate"
request = "step2_activate.json"
assert_success = true

[[steps]]
operation = "Encrypt"
request = "step3_encrypt.json"
assert_success = false
# KMIP 2.1 Encrypt error table: an invalid TagLength is Bad_Cryptographic_Parameters
# (OASIS CS-BC-M-GCM-1-21 expects General_Failure, which the table does not list).
assert_error_reason = "Bad_Cryptographic_Parameters"
assert_error_contains = "tag"
