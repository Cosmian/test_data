name = "Negative: Encrypt - Bad Cryptographic Parameters"
description = "Tests that Encrypt returns Bad_Cryptographic_Parameters error as per KMIP spec"

[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Activate"
request = "step2_activate.json"
assert_success = true

[[steps]]
operation = "Encrypt"
request = "step3_encrypt.json"
assert_success = false
# OASIS CS-BC-M-GCM-1-21 / CS-BC-M-CHACHA20POLY1305-1-21 mandate General_Failure for an invalid TagLength.
assert_error_reason = "General_Failure"
assert_error_contains = "tag"
