name = "Negative: Decrypt AES-CBC with missing IVCounterNonce returns Missing_Initialization_Vector"
description = """
When IVCounterNonce is absent from a CBC Decrypt request the KMS must return
Missing_Initialization_Vector with message "missing-iv" (KMIP 2.1 Decrypt error
table; the OASIS vectors CS-BC-M-11-14/21 expect Invalid_Message instead).

This is distinct from an explicitly empty IVCounterNonce (Some([])), which the
KMS treats as a request for an all-zero IV.
"""

[[steps]]
operation = "Create"
request = "step1_create_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Decrypt"
request = "step2_decrypt_no_iv.json"
assert_success = false
assert_error_reason = "Missing_Initialization_Vector"
assert_error_contains = "missing-iv"
