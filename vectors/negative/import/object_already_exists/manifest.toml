name = "Negative: Import - Object Already Exists"
description = "Tests that Import of an existing Unique Identifier without Replace Existing fails with Object_Already_Exists (KMIP 2.1 Table 240)"

[[steps]]
operation = "Import"
request = "step1_import.json"
assert_success = true

[[steps]]
operation = "Import"
request = "step2_import_again.json"
assert_success = false
assert_error_reason = "Object_Already_Exists"
assert_error_contains = "already exist"
