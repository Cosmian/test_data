name = "HSM Resident: Ed25519 keypair rejected (FIPS build)"
description = """
Attempts to create an Ed25519 keypair with an HSM-resident UID in a FIPS
build. Ed25519 HSM keypair creation is gated behind the non-fips feature
(Ed25519 is not FIPS-approved here), so this is rejected; see
resident_ed25519_created for the non-FIPS success case.
Tests: HSM rejects Ed25519 keypair creation in FIPS builds.
"""
server_type = "hsm_kek"
requires_env = ["HSM_SLOT_ID"]
backends = ["sqlite"]

[[steps]]
operation = "CreateKeyPair"
request = "step1_create_keypair.json"
assert_success = false
assert_error_contains = "only support RSA keypair"
