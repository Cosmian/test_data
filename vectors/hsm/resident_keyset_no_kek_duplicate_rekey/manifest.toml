name = "HSM No-KEK: Re-key of a retired generation without keyset redirects to latest"
description = """
Creates an HSM-resident key WITHOUT a keyset name (no rotate_name). The first
ReKey enrolls it in a keyset named after its base UID (gen-0 → gen-1). Re-keying
gen-0 again no longer fails with \"already exists\": gen-0 is a retired
generation, so the request is redirected to the latest generation (gen-1) and
produces gen-2.
"""
server_type = "hsm"
requires_env = ["HSM_SLOT_ID"]
backends = ["sqlite"]

# ── Pre-cleanup ──────────────────────────────────────────────────────────

[[steps]]
operation = "Destroy"
request = "step0a_cleanup_gen0.json"
allow_failure = true

[[steps]]
operation = "Destroy"
request = "step0b_cleanup_gen1.json"
allow_failure = true

[[steps]]
operation = "Destroy"
request = "step0c_cleanup_gen2.json"
allow_failure = true

# ── 1. Create gen-0 (no rotate_name) ────────────────────────────────────

[[steps]]
operation = "Create"
request = "step1_create_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

# ── 2. First ReKey gen-0 → gen-1 (SUCCESS) ───────────────────────────────

[[steps]]
operation = "ReKey"
request = "step2_rekey_first.json"
assert_success = true
[steps.capture]
gen1_id = "UniqueIdentifier"

# ── 3. Second ReKey gen-0 again → SUCCESS (redirected to latest gen-1 → gen-2) ──

[[steps]]
operation = "ReKey"
request = "step3_rekey_duplicate.json"
assert_success = true

# ── Cleanup ──────────────────────────────────────────────────────────────

[[steps]]
operation = "Destroy"
request = "step0a_cleanup_gen0.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step0b_cleanup_gen1.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step0c_cleanup_gen2.json"
assert_success = true
