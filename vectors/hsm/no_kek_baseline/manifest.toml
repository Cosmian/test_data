name = "Baseline: AES-256-GCM Encrypt/Decrypt without KEK (no HSM)"
description = """
Imports the same AES-256 key as kek_encrypt_decrypt scenario but on a plain SQLite
server without any HSM or KEK. The server generates the IV (a FIPS build refuses a
caller-chosen one); the ciphertext is decrypted back with the returned IV, tag and AAD.
This confirms the round trip is identical regardless of whether a KEK wraps the key at rest.
"""
backends = ["sqlite"]

[[steps]]
operation = "Import"
request = "step1_import_key.json"
assert_success = true
[steps.capture]
key_id = "UniqueIdentifier"

[[steps]]
operation = "Encrypt"
request = "step2_encrypt.json"
assert_success = true
[steps.capture]
ciphertext = "Data"
auth_tag = "AuthenticatedEncryptionTag"
iv = "IVCounterNonce"

[[steps]]
operation = "Decrypt"
request = "step3_decrypt.json"
assert_success = true
[steps.assert_fields]
Data = "D9313225F88406E5A55909C5AFF5269A86A7A9531534F7DA2E4C303D8A318A721C3C0C95956809532FCF0E2449A6B525B16AEDF5AA0DE657BA637B391AAFD255"
