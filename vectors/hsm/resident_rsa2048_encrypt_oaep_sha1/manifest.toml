name = "HSM Resident: RSA-2048 OAEP-SHA1 encrypt rejected (SoftHSM2 limitation)"
description = """
Creates an RSA-2048 keypair on the HSM, then attempts to encrypt with RSA-OAEP-SHA1.
SoftHSM2 2.6.1 rejects CKM_RSA_PKCS_OAEP with explicit mechanism parameters
(CKR_ARGUMENTS_BAD) regardless of the OAEP hash/MGF digest requested — this is the
same underlying SoftHSM2 limitation documented in
`test_data/vectors/hsm/resident_rsa2048_encrypt_oaep_sha256`, confirmed by a direct
PKCS#11-level reproduction (bypassing the KMIP/server layer) in
`crate/hsm/softhsm2/src/tests.rs::test_hsm_softhsm2_rsa_oaep_encrypt`.
This vector documents the SoftHSM2 limitation — other HSMs may support this.
Tests: SoftHSM2 rejects RSA-OAEP-SHA1 with return code 7.
"""
server_type = "hsm_kek"
requires_env = ["HSM_SLOT_ID"]
requires_hsm_models = ["softhsm2"]
backends = ["sqlite"]

# Cleanup: destroy keys from any prior run (may not exist)
[[steps]]
operation = "Destroy"
request = "step4_destroy_sk.json"
allow_failure = true

[[steps]]
operation = "Destroy"
request = "step5_destroy_pk.json"
allow_failure = true

[[steps]]
operation = "CreateKeyPair"
request = "step1_create_keypair.json"
assert_success = true

[[steps]]
operation = "Encrypt"
request = "step2_encrypt.json"
assert_success = false
assert_error_contains = "Failed to initialize encryption"

[[steps]]
operation = "Destroy"
request = "step4_destroy_sk.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step5_destroy_pk.json"
assert_success = true
