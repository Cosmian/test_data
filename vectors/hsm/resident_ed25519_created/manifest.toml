name = "HSM Resident: Ed25519 keypair creation (non-FIPS)"
description = """
Creates an Ed25519 keypair with an HSM-resident UID.
The HSM backend supports Ed25519 keypair creation in non-FIPS builds only
(Ed25519 is not a FIPS-approved algorithm here); this vector is skipped
in FIPS test runs, where resident_ed25519_rejected applies instead.
Tests: HSM accepts Ed25519 keypair creation (non-FIPS).
"""
server_type = "hsm_kek"
requires_env = ["HSM_SLOT_ID"]
backends = ["sqlite"]

# Cleanup
[[steps]]
operation = "Destroy"
request = "step2_destroy_sk.json"
allow_failure = true

[[steps]]
operation = "Destroy"
request = "step3_destroy_pk.json"
allow_failure = true

[[steps]]
operation = "CreateKeyPair"
request = "step1_create_keypair.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step2_destroy_sk.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step3_destroy_pk.json"
assert_success = true
