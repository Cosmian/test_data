name = "HSM Resident: EC P-256 keypair creation"
description = """
Creates an EC P-256 keypair with an HSM-resident UID.
Since PR hsm_delegation, the HSM backend supports creating EC keypairs
(in addition to RSA), so this now succeeds.
Tests: HSM accepts EC P-256 keypair creation.
"""
server_type = "hsm_kek"
requires_env = ["HSM_SLOT_ID"]
backends = ["sqlite"]

# Cleanup
[[steps]]
operation = "Destroy"
request = "step2_destroy_sk.json"
allow_failure = true

[[steps]]
operation = "Destroy"
request = "step3_destroy_pk.json"
allow_failure = true

[[steps]]
operation = "CreateKeyPair"
request = "step1_create_keypair.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step2_destroy_sk.json"
assert_success = true

[[steps]]
operation = "Destroy"
request = "step3_destroy_pk.json"
assert_success = true
