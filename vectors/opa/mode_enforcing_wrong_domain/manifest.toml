name = "OPA Mode 3 (Enforcing): CryptoOfficer wrong domain denied (cross-domain isolation in dual-gate mode)"
description = """
OPA enforcing (dual-gate) mode — multi-tenant isolation.

The default CryptoOfficer (kms-opa-test, domain=kms-opa-test) creates an AES key.
A CryptoOfficer from realm `kms-opa-other` (domain=kms-opa-other, non-owner) attempts
`Get` on that key.  In enforcing mode, BOTH the OPA gate AND the native KMS permission
check must allow.  The OPA gate fails first: `same_domain` check returns false because
`user_domain (kms-opa-other) != object_domain (kms-opa-test)` → OPA returns
`allow=false` → KMS returns Object_Not_Found.

The existing `mode_exclusive_wrong_domain` covers Mode 2 (exclusive).  This vector
proves that domain isolation is not an exclusive-mode artefact — it is enforced in
Mode 3 as well, which is the recommended production mode.

Ref: kms.rego same_domain helper (ANSI/INCITS 359-2004 §4.2 Constrained RBAC;
NIST SP 800-53 Rev 5 AC-3 access enforcement, AC-4 information flow enforcement;
NIST SP 800-53 Rev 5 SC-28 protection of information at rest).
"""
requires_env = ["KMS_OPA_URL", "KMS_AUTH_SERVER_URL"]
backends = ["sqlite"]

# JWT-based identity: other-domain CryptoOfficer (kms-opa-other).
[identities.other_domain]
access_token_env = "KMS_TEST_OPA_OTHER_DOMAIN_JWT"

# Step 1: default client (test-domain CO) creates the key.
[[steps]]
operation = "Create"
request = "step1_create.json"
assert_success = true

[steps.capture]
key_id = "UniqueIdentifier"

# Step 2: other-domain CO (non-owner, wrong domain) attempts Get — OPA gate denies.
[[steps]]
operation = "Get"
request = "step2_get.json"
identity = "other_domain"
assert_success = false
assert_error_reason = "Object_Not_Found"
assert_error_contains = "not found"

# Cleanup: test-domain CO (owner) destroys the key.
[[steps]]
operation = "Destroy"
request = "step3_destroy.json"
allow_failure = true
