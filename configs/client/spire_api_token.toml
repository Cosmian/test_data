# KMS client — API-token authentication for SPIRE test KMS instances.
# Used by spire_write_api_token_conf in .mise/lib/spire_test.sh.
# server_url and access_token are substituted from the running test instance.

[http_config]
server_url = "https://localhost:9998"
accept_invalid_certs = true
access_token = "<API_TOKEN>"
