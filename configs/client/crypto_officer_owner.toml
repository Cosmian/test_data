# Test KMS client — HTTPS with owner PEM client certificate, no JWT. Owner identity.
# Cert paths are relative to workspace root, resolved by load_client_config().
# Corresponds to server config crypto_officer_users.toml (port 10003).

vendor_id = "cosmian"

[http_config]
server_url = "https://localhost:10003"
accept_invalid_certs = true
tls_client_pem_cert_path = "test_data/certificates/client_server/owner/owner.client.acme.com.crt"
tls_client_pem_key_path = "test_data/certificates/client_server/owner/owner.client.acme.com.key"
