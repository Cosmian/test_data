# Minimal default configuration from quick_start.md
# Manual test config for the Cosmian authentication server ("AS" / "SA") Web UI login
# (`POST /ui/login_as`). Pair with a locally running `authentication` server, e.g.
# from the sibling `authentication` repo:
#
#   cargo run -p auth_server -- server/auth_server.dev.toml
#
# which listens on https://localhost:8443 with a self-signed dev certificate and a
# default admin realm ("_") — hence `cosmian_auth_accept_invalid_certs = true` below.
# See CHANGELOG/test_plan_cosmian-auth-ui-login.md for the full manual test plan.
vendor_identification = "test_vendor"

[http]
port = 9998
hostname = "localhost"
kms_public_url = "http://localhost:9998"

[cosmian_auth]
cosmian_auth_server_url = "https://localhost:8443"
cosmian_auth_realm = "_"
cosmian_auth_accept_invalid_certs = true

[ui_config]
ui_index_html_folder = "ui/dist"

[logging]
rust_log = "info,cosmian_kms=debug"
quiet = false
log_to_syslog = false
environment = "development"
ansi_colors = true
