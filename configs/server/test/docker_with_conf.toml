# Docker image smoke test — configuration-file startup (compose service `kms-with-conf`).
# Plain HTTP, no authentication: the explicit development-only opt-in is required because the
# server binds a non-loopback address. A configuration file replaces CLI arguments and
# environment variables, so the opt-in must live here.

[http]
insecure_allow_unauthenticated = true
port = 9998
hostname = "0.0.0.0"

[db]
database_type = "sqlite"
