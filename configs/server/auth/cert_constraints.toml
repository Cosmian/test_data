# Test KMS server — mTLS cert auth, dedicated to the Set Constraints vector.
# The constraint set is server-wide, so this vector gets its own server instead of
# sharing auth/cert.toml. Ports and storage paths are overridden by the test runner.

default_username = "tech@cosmian.com"

[http]
port = 9998
hostname = "0.0.0.0"

[db]
database_type = "sqlite"
sqlite_path = "/tmp/kms_test_cert_constraints"
clear_database = true

[workspace]
root_data_path = "/tmp/kms_test_workspace_cert_constraints"
tmp_path = "/tmp"

[tls]
tls_cert_file = "test_data/certificates/client_server/server/kmserver.acme.com.crt"
tls_key_file = "test_data/certificates/client_server/server/kmserver.acme.com.key"
clients_ca_cert_file = "test_data/certificates/client_server/ca/ca.crt"
