# Test KMS server — TLS with mutual client-certificate authentication + RBAC roles.
# Bound to port 9998. Loaded by vector runner tests for operator/crypto-officer scenarios.

default_username = "tech@cosmian.com"
kms_public_url = "https://localhost:9998/google_cse"

[http]
port = 9998
hostname = "0.0.0.0"

[db]
database_type = "sqlite"
sqlite_path = "/tmp/kms_test_cert_roles"
clear_database = true

[workspace]
root_data_path = "/tmp/kms_test_workspace_cert_roles"
tmp_path = "/tmp"

[tls]
tls_cert_file = "test_data/certificates/client_server/server/kmserver.acme.com.crt"
tls_key_file = "test_data/certificates/client_server/server/kmserver.acme.com.key"
clients_ca_cert_file = "test_data/certificates/client_server/ca/ca.crt"

[roles]
crypto_officer_users = ["tech@cosmian.com"]

[google_cse_config]
google_cse_enable = true
google_cse_disable_tokens_validation = true
google_cse_incoming_url_whitelist = ["https://cse.cosmian.com"]
