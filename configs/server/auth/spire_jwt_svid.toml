# Auth test server configuration — SPIRE SPIFFE JWT-SVID & OIDC Discovery Provider.
#
# ── 1. Workload JWT-SVID Authentication ───────────────────────────────────────
# Workloads authenticate to KMIP/REST endpoints via:
#   Authorization: Bearer <JWT-SVID>
# The KMS validates signatures against the SPIRE JWKS endpoint (port 8088),
# accepts tokens without an `email` claim when `jwt_svid_auth = true`,
# and sets user identity from `sub = spiffe://<trust-domain>/<workload-path>`.
#
# ── 2. Web UI OIDC Login ──────────────────────────────────────────────────────
# The Web UI performs standard OIDC authorization-code flow with PKCE.
# SPIRE OIDC Discovery Provider (port 8008) serves .well-known/openid-configuration,
# authorization_endpoint, token_endpoint, and jwks_uri for browser-based login.

default_username = "admin"
kms_public_url = "https://localhost:9998"

[http]
port = 9998
hostname = "0.0.0.0"

[db]
database_type = "sqlite"
sqlite_path = "./sqlite-data-spire-auth"
clear_database = false

[workspace]
root_data_path = "/tmp/kms_test_workspace_spire"
tmp_path = "/tmp"

[tls]
tls_cert_file = "test_data/spire/certs/kms.crt"
tls_key_file = "test_data/spire/certs/kms.key"
clients_ca_cert_file = "test_data/spire/certs/ca.crt"

[idp_auth]
jwt_auth_provider = [
  "https://cosmian-test-a.local,http://127.0.0.1:8088/jwks.json,cosmian-kms"
]
jwt_svid_auth = true

[ui_config]
enable = true
ui_index_html_folder = "ui/dist"

[ui_config.ui_oidc_auth]
ui_oidc_client_id = "cosmian-kms-ui"
ui_oidc_issuer_url = "http://127.0.0.1:8008"
ui_oidc_logout_url = "http://127.0.0.1:8008/logout"
