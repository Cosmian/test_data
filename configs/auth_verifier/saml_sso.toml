# =============================================================================
# Auth Verifier — SAML single sign-on stack (SAML Service Provider), dev/test only
# =============================================================================
#
# Loaded by `.mise/scripts/test/saml_sso/stack.sh up` (used by `mise run test:ui-saml`),
# which copies this file to `${SAML_SSO_DIR}/auth_verifier.toml` and substitutes the values
# of `host_name` (the docker bridge gateway on Linux, loopback on macOS) and of the key/cert
# paths (throw-away keys generated in `${SAML_SSO_DIR}`, default `/tmp/kms-saml-sso`).
# It runs `cargo run -p auth_verifier --features saml` from the `authentication` submodule.
#
# Bound port: 8444 (nginx and the KMS reach it there).
# Paired KMS fixture: test_data/configs/server/auth/saml_sso.toml
#
# Default credentials seeded at first start (realm = "_"): admin / change_me.
# The stack then creates the SAML realm `kms-saml` from the Keycloak IdP metadata.
# =============================================================================

# Never 0.0.0.0: the dev Auth Verifier seeds a default admin login.
host_name = "127.0.0.1"
host_port = 8444

roles = ["SuperAdmin", "DomainAdmin", "CryptoOfficer", "Auditor", "User"]

# Self-signed EC P-256 TLS key and certificate generated by stack.sh.
[tls_params]
server_private_key = "/tmp/kms-saml-sso/tls.key.pem"
server_certificate = "/tmp/kms-saml-sso/tls.cert.pem"
server_ca_chain    = "/tmp/kms-saml-sso/tls.cert.pem"

# Session JWTs (ES256) are signed with the same throw-away P-256 key as TLS; the KMS
# verifies them against the Auth Verifier JWKS.
[session_jwt_params]
jwt_ec_private_key = "/tmp/kms-saml-sso/tls.key.pem"
jwt_ec_public_key  = "/tmp/kms-saml-sso/tls.cert.pem"

# In-memory SQLite: realms and users are discarded when the process exits.
[database_params]
backend        = "sqlite"
connection_url = "sqlite::memory:"

# RSA SAML SP signing key and certificate generated by stack.sh (also injected into the
# Keycloak realm as the SP certificate).
[saml_sp_params]
saml_rsa_private_key = "/tmp/kms-saml-sso/saml-sp.key.pem"
saml_certificate     = "/tmp/kms-saml-sso/saml-sp.cert.pem"
