# nginx/vault-proxy.conf — Route Vault API calls to the correct backend.
#
# SPIRE uses a single `vault_addr` for all Vault API calls.
# This nginx config splits them:
#   /v1/auth/*      → auth-verifier (AppRole login, token lookup)
#   /v1/transit/*   → cosmian-kms (transit encrypt/sign/verify)
#   /v1/<pki>/*     → cosmian-kms (PKI sign-intermediate)
#
# auth-verifier and cosmian-kms run on the *host* via `cargo run`.
# Inside Docker, host services are reachable at host.docker.internal.
# The cert SANs include `localhost` which also matches `host.docker.internal`
# when proxy_ssl_name is overridden to `localhost`.

events {
    worker_connections 1024;
}

http {
    # Shared TLS client config for upstream requests
    # (backends present certs signed by our test CA)
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_verify               on;
    proxy_ssl_verify_depth         2;

    # Forward real client IP
    proxy_set_header X-Real-IP      $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Pass Vault token header through
    proxy_set_header X-Vault-Token  $http_x_vault_token;

    server {
        listen 8200 ssl;
        server_name vault-proxy;

        ssl_certificate     /etc/nginx/certs/proxy.crt;
        ssl_certificate_key /etc/nginx/certs/proxy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Auth routes → auth-verifier (host) ───────────────────────────
        location /v1/auth/ {
            proxy_pass         https://host.docker.internal:8443/v1/auth/;
            proxy_ssl_name     localhost;
            proxy_http_version 1.1;
        }

        # ── Transit routes → cosmian-kms (host) ──────────────────────────
        location /v1/transit/ {
            proxy_pass         https://host.docker.internal:9998/v1/transit/;
            proxy_ssl_name     localhost;
            proxy_http_version 1.1;
        }

        # ── PKI routes → cosmian-kms (host) ───────────────────────────────
        location /v1/pki/ {
            proxy_pass         https://host.docker.internal:9998/v1/pki/;
            proxy_ssl_name     localhost;
            proxy_http_version 1.1;
        }
    }
}
