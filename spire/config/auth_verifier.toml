# Cosmian auth-verifier configuration for SPIRE integration tests.
#
# Used by the `mise run test:spire` task when starting the auth-verifier via
# `cargo run`. Paths are relative to the kms_alt5 repository root.

# ── Network binding ────────────────────────────────────────────────────────────
# Bind to all interfaces (not just loopback): the SPIRE server and the
# provision.sh smoke test reach this process from inside Docker containers via
# host.docker.internal, which (on Linux) routes through a real host interface,
# not the loopback interface -- a 127.0.0.1-only bind is unreachable from
# containers there (this is not an issue on macOS Docker Desktop, whose
# host.docker.internal implementation proxies regardless of bind address,
# which is why this only surfaces in CI).
host_name = "0.0.0.0"
host_port = 8443

roles = ["SuperAdmin", "DomainAdmin", "CryptoOfficer", "Auditor", "User"]

# ── TLS ────────────────────────────────────────────────────────────────────────
[tls_params]
server_private_key = "test_data/spire/certs/auth.key"
server_certificate = "test_data/spire/certs/auth.crt"
server_ca_chain    = "test_data/spire/certs/ca.crt"

# ── JWT signing key (must be P-256; separate from TLS key) ────────────────────
# The TLS cert uses P-384; the JWKS builder requires P-256, so we provide
# a dedicated P-256 key pair for JWT signing (generated by generate-test-certs.sh).
[session_jwt_params]
jwt_ec_private_key = "test_data/spire/certs/jwt.key.pem"
jwt_ec_public_key  = "test_data/spire/certs/jwt.pub.pem"

# ── Primary database ───────────────────────────────────────────────────────────
[database_params]
backend        = "sqlite"
connection_url = "sqlite:///tmp/auth-verifier-spire-test.db"
