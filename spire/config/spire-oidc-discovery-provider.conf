# SPIRE OIDC Discovery Provider configuration for Cosmian KMS Web UI authentication.
# Serves .well-known/openid-configuration on port 8008.

log_level = "debug"
domains = ["127.0.0.1", "localhost"]
allow_insecure_scheme = true
insecure_addr = "0.0.0.0:8008"

server_api {
    address = "unix:///tmp/spire-server/private/api.sock"
}
