# Envoy SDS downstream configuration — mTLS client side.
#
# Envoy fetches its X.509-SVID and trust bundle from the SPIRE agent via SDS.
# No static certificate files are used — this is the core of PKI-10.
#
# Identity: spiffe://cosmian-test-a.local/envoy-downstream
# Ports:
#   :8001 — plaintext ingress (probe input from socat-probe)
#   :9902 — admin interface (health / stats)

node:
  id: "envoy-downstream"
  cluster: "spire-sds-test"

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9902

static_resources:
  clusters:
  # ── Upstream cluster: envoy-upstream via mTLS ─────────────────────────────
  - name: upstream_mtls
    connect_timeout: 2s
    type: STRICT_DNS
    load_assignment:
      cluster_name: upstream_mtls
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: envoy-sds-upstream
                port_value: 8001
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          # Client cert: X.509-SVID from SPIRE via SDS — no static cert file
          tls_certificate_sds_secret_configs:
          - name: "spiffe://cosmian-test-a.local/envoy-downstream"
            sds_config:
              resource_api_version: V3
              api_config_source:
                api_type: GRPC
                transport_api_version: V3
                grpc_services:
                - envoy_grpc:
                    cluster_name: spire_agent
          # CA bundle: trust bundle from SPIRE via SDS — no static CA file
          combined_validation_context:
            default_validation_context:
              match_typed_subject_alt_names:
              - san_type: URI
                matcher:
                  prefix: "spiffe://cosmian-test-a.local/"
            validation_context_sds_secret_config:
              name: "spiffe://cosmian-test-a.local"
              sds_config:
                resource_api_version: V3
                api_config_source:
                  api_type: GRPC
                  transport_api_version: V3
                  grpc_services:
                  - envoy_grpc:
                      cluster_name: spire_agent

  # ── SPIRE agent SDS cluster (Unix socket) ────────────────────────────────
  - name: spire_agent
    connect_timeout: 1s
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: spire_agent
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe:
                path: /tmp/spire-agent/public/api.sock

  listeners:
  # ── Plaintext ingress: accepts probe traffic, forwards via mTLS ───────────
  - name: listener_ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8001
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          cluster: upstream_mtls
          stat_prefix: probe_ingress
