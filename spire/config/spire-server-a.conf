# SPIRE server configuration for Cosmian KMS integration test — TENANT A.
#
# One of two INDEPENDENT SPIRE deployments (tenants "a" and "b") that both run
# against the SAME Cosmian KMS. Each tenant has its own trust domain and its own
# AppRole, and signs its own intermediate CA via the KMS PKI engine, chaining to
# the same KMS root CA (tag vault_pki_ca). This proves the KMS is a valid
# multi-tenant Vault upstream authority.
#
# Key plugins:
#   KeyManager        — disk: built-in, stores SPIRE signing keys on disk
#                       (vault KeyManager is an external binary not shipped in
#                        the SPIRE Docker image; use disk for the integration test)
#   UpstreamAuthority — vault: signs SPIRE intermediate CA via Cosmian KMS PKI engine
#                       (built-in to SPIRE; no plugin_cmd required)
#   NodeAttestor      — join_token (simplest for local testing; replace with x509pop in prod)
#   DataStore         — SQL (sqlite for simplicity; switch to postgres for multi-server)
#
# vault_addr points directly at Cosmian KMS:
#   /v1/auth/*      → KMS proxies to auth-verifier (AppRole login, token lookup)
#   /v1/transit/*   → KMS handles directly (key management, signing)
#   /v1/pki/*       → KMS handles directly (sign-intermediate)

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"

    # Trust domain — must match SPIFFE IDs used by workloads (tenant a).
    trust_domain = "cosmian-test-a.local"

    # SQLite data directory (bind-mounted volume in Docker).
    data_dir = "/data/spire-server"

    # Log level: DEBUG for integration tests; INFO for production.
    log_level = "DEBUG"

    ca_subject = {
        country = ["FR"],
        organization = ["Cosmian"],
        common_name = "Cosmian SPIRE Test A",
    }

    # CA TTL — how long before SPIRE rotates its intermediate CA.
    ca_ttl = "24h"
    # SVID TTL — how long individual workload SVIDs are valid.
    default_x509_svid_ttl = "1h"
}

plugins {
    # ── Key Manager: disk (built-in) ──────────────────────────────────────────
    # Stores SPIRE signing keys in a JSON file on disk.
    # The vault KeyManager is an external Go plugin not bundled with the SPIRE
    # Docker image; transit endpoint coverage is provided by provision.sh.
    KeyManager "disk" {
        plugin_data {
            keys_path = "/data/spire-server/keys.json"
        }
    }

    # ── Upstream Authority: Vault PKI engine (built-in) ───────────────────────
    # Built-in to SPIRE 1.9.x — no plugin_cmd required.
    # Authenticates via AppRole (credentials injected via env vars by mise task).
    # vault_addr points directly at Cosmian KMS, which proxies /v1/auth/* to
    # auth-verifier and handles /v1/transit/* and /v1/pki/* natively.
    UpstreamAuthority "vault" {
        plugin_data {
            vault_addr = "https://host.docker.internal:9998"
            ca_cert_path = "/etc/spire/server/ca.crt"

            # AppRole authentication — credentials read from
            # VAULT_APPROLE_ID and VAULT_APPROLE_SECRET_ID env vars.
            approle_auth {
                approle_auth_mount_point = "approle"
            }

            # PKI mount for signing intermediate CA CSRs.
            pki_mount_point = "pki"
        }
    }

    # ── Node Attestor: join token (dev/test only) ─────────────────────────────
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # ── Data Store: SQLite ────────────────────────────────────────────────────
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/data/spire-server/datastore.sqlite3"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
