# SPIRE agent configuration for Cosmian KMS integration test.

agent {
    data_dir     = "/data/spire-agent"
    log_level    = "DEBUG"
    trust_domain = "cosmian-test.local"

    # gRPC address of the SPIRE server.
    server_address = "spire-server"
    server_port    = 8081

    # Agent socket for workload API.
    socket_path = "/tmp/spire-agent/public/api.sock"
}

plugins {
    # ── Node Attestor: join token ─────────────────────────────────────────────
    NodeAttestor "join_token" {
        plugin_data {
            # Token must match the one created by the SPIRE server during provisioning.
            # In a real deployment use x509pop or TPM attestation.
            join_token = "cosmian-test-join-token-12345"
        }
    }

    # ── Key Manager: in-memory (agent keys are ephemeral) ────────────────────
    KeyManager "memory" {
        plugin_data {}
    }

    # ── Workload Attestor: Unix (process UID/GID matching) ───────────────────
    WorkloadAttestor "unix" {
        plugin_data {
            # When set to true, the agent resolves UIDs to users and GIDs to groups.
            discover_workload_dir = true
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8082"
    live_path        = "/live"
    ready_path       = "/ready"
}
