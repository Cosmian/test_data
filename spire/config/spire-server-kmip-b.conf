# SPIRE server configuration for the eviden_kms native KMIP 2.1 plugins — TENANT A.
#
# Counterpart to spire-server-kmip-b.conf (which uses the vault+auth-verifier stack).
# This config uses the eviden_kms built-in plugins that speak KMIP 2.1 directly
# to Eviden KMS — no auth-verifier, no AppRole tokens, no Vault-compatible layer.
#
# Authentication to KMS: mTLS (client cert signed by the test CA).
#   Client cert: test_data/spire/certs/spire-client.crt
#   Client key:  test_data/spire/certs/spire-client.key
#   CA cert:     test_data/spire/certs/ca.crt  (verifies the KMS server cert)
#
# The KMS must be started with:
#   [tls]
#   tls_cert_file       = .../kms.crt
#   tls_key_file        = .../kms.key
#   clients_ca_cert_file = .../ca.crt   ← enforces mutual TLS

server {
    bind_address = "0.0.0.0"
    bind_port    = "8082"

    trust_domain = "cosmian-test-b.local"
    data_dir     = "/data/spire-server"
    log_level    = "DEBUG"

    ca_subject = {
        country      = ["FR"],
        organization = ["Cosmian"],
        common_name  = "SPIRE KMIP Test B",
    }

    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"
}

plugins {
    # ── KeyManager: eviden_kms — keys stored in Eviden KMS via KMIP 2.1 ──────
    # The plugin creates EC/RSA key pairs in the KMS and tags them with
    # x-spire-server-id:spire-kmip-b and x-spire-key-id:<key-id>.
    # On restart, existing keys are recovered via KMIP Locate (no local state).
    KeyManager "eviden_kms" {
        plugin_data {
            # KMS address — host.docker.internal for Docker containers on macOS;
            # localhost when running SPIRE as a host process.
            kms_addr     = "https://host.docker.internal:9998"
            ca_cert_path = "/etc/spire/certs/ca.crt"
            server_id    = "spire-kmip-b"

            # mTLS: SPIRE authenticates to KMS with its client certificate.
            cert_auth {
                client_cert_path = "/etc/spire/certs/spire-client.crt"
                client_key_path  = "/etc/spire/certs/spire-client.key"
            }
        }
    }

    # ── UpstreamAuthority: eviden_kms — intermediate CA via KMIP Certify ──────
    # The CA private key (ca_key_uid) must be provisioned in the KMS before
    # SPIRE starts. The plugin auto-discovers ca_cert_uid via the CertificateLink
    # stored on the public key — no manual ca_cert_uid configuration needed.
    UpstreamAuthority "eviden_kms" {
        plugin_data {
            kms_addr   = "https://host.docker.internal:9998"
            ca_cert_path = "/etc/spire/certs/ca.crt"
            ca_key_uid = "spire-kmip-root-ca-key"

            cert_auth {
                client_cert_path = "/etc/spire/certs/spire-client.crt"
                client_key_path  = "/etc/spire/certs/spire-client.key"
            }
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/data/spire-server/datastore.sqlite3"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8080"
    live_path        = "/live"
    ready_path       = "/ready"
}
