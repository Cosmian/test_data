# SPIRE agent configuration for Cosmian KMS integration test — TENANT A.

agent {
    data_dir     = "/data/spire-agent"
    log_level    = "DEBUG"
    trust_domain = "cosmian-test-a.local"

    # gRPC address of the SPIRE server (tenant a).
    server_address = "localhost"
    server_port    = 8081

    # Agent socket for workload API.
    socket_path = "/tmp/spire-agent/public/api.sock"

    # Skip TLS verification for bootstrap — acceptable for local integration
    # tests. The agent downloads the real trust bundle from the server after
    # the first successful attestation.
    insecure_bootstrap = true

    # In SPIRE 1.9.x the join_token belongs in the agent block (not plugin_data).
    # This placeholder is replaced by the mise task with the real one-time token.
    join_token = "cosmian-test-join-token-12345"
}

plugins {
    # ── Node Attestor: join token ─────────────────────────────────────────────
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # ── Key Manager: in-memory (agent keys are ephemeral) ────────────────────
    KeyManager "memory" {
        plugin_data {}
    }

    # ── Workload Attestor: Unix (process UID/GID matching) ───────────────────
    WorkloadAttestor "unix" {
        plugin_data {
            # Keep false: Docker containers run in a different mount namespace, so
            # the agent cannot resolve the workload binary path cross-namespace.
            # uid/gid selectors (always populated) are sufficient for our tests.
            discover_workload_dir = false
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address     = "0.0.0.0"
    bind_port        = "8082"
    live_path        = "/live"
    ready_path       = "/ready"
}
